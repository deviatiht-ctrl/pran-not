<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planifikatè — Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pran Nòt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/mobile-nav.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <main id="main" class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow"><i data-lucide="calendar" aria-hidden="true"></i><span data-i18n="nav.planner"></span></span>
        <h1 data-i18n="planner.title"></h1>
        <p data-i18n="planner.sub"></p>
      </div>
    </div>

    <div class="grid grid-2 mb-8">
      <!-- Minuteur Pomodoro -->
      <section class="card">
        <div class="card-head">
          <h2 class="card-title" data-i18n="planner.pomodoro"></h2>
          <div class="segmented">
            <button type="button" id="pomo-mode-work" aria-pressed="true" data-i18n="planner.work_min"></button>
            <button type="button" id="pomo-mode-break" aria-pressed="false" data-i18n="planner.break_min"></button>
          </div>
        </div>
        <div class="timer-display mb-4" id="pomo-display">25:00</div>
        <div class="field">
          <label for="pomo-course" data-i18n="nav.courses"></label>
          <select class="select" id="pomo-course">
            <option value="" data-i18n="common.no_course"></option>
          </select>
        </div>
        <div class="row-wrap">
          <button type="button" class="btn btn-primary" id="pomo-start-btn"><i data-lucide="play" aria-hidden="true"></i><span data-i18n="planner.start"></span></button>
          <button type="button" class="btn btn-secondary" id="pomo-pause-btn" hidden><i data-lucide="pause" aria-hidden="true"></i><span data-i18n="planner.pause"></span></button>
          <button type="button" class="btn btn-secondary" id="pomo-reset-btn"><i data-lucide="rotate-ccw" aria-hidden="true"></i><span data-i18n="planner.reset"></span></button>
          <button type="button" class="btn btn-ghost" id="pomo-log-btn"><i data-lucide="check" aria-hidden="true"></i><span>Sove sesyon kounye a</span></button>
        </div>
      </section>

      <!-- Planning à rebours des examens -->
      <section class="card">
        <h2 class="card-title mb-3" data-i18n="planner.countdown_title"></h2>
        <div class="form-row">
          <div class="field">
            <label for="plan-course" data-i18n="nav.courses"></label>
            <select class="select" id="plan-course"></select>
          </div>
          <div class="field">
            <label for="plan-exam-date" data-i18n="courses.exam_date"></label>
            <input class="input" id="plan-exam-date" type="date">
          </div>
        </div>
        <button type="button" class="btn btn-dark mb-4" id="gen-backwards-btn">
          <i data-lucide="calendar-check" aria-hidden="true"></i>
          <span data-i18n="planner.generate_plan"></span>
        </button>
        <div id="exam-schedule-box"></div>
      </section>
    </div>

    <!-- Groupes d'étude -->
    <section class="card">
      <div class="card-head">
        <div>
          <h2 class="card-title" data-i18n="planner.groups_title"></h2>
          <p class="text-sm muted mb-0">Pataje nòt ak pake kat memwa ak kamarad ou yo ak kòd envitasyon.</p>
        </div>
        <div class="row-wrap">
          <button type="button" class="btn btn-secondary btn-sm" id="join-group-btn"><i data-lucide="log-in" aria-hidden="true"></i><span data-i18n="planner.join_group"></span></button>
          <button type="button" class="btn btn-primary btn-sm" id="create-group-btn"><i data-lucide="plus" aria-hidden="true"></i><span data-i18n="planner.create_group"></span></button>
        </div>
      </div>
      <div id="groups-box" class="grid grid-2"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../assets/js/pages/planner.js"></script>
</body>
</html>
