<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IA ak kota — Administrasyon Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pran Nòt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/navbar.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <div class="admin-shell">
    <aside id="admin-sidebar" class="admin-sidebar"></aside>

    <main id="main" class="admin-main">
      <div class="page-head">
        <div>
          <span class="eyebrow"><i data-lucide="cpu" aria-hidden="true"></i><span data-i18n="admin.title"></span></span>
          <h1 data-i18n="admin.nav_ai"></h1>
          <p class="muted" data-i18n="admin.ai_sub"></p>
        </div>
        <div class="page-head-actions">
          <button type="button" class="btn btn-primary" id="new-prompt-btn">
            <i data-lucide="plus" aria-hidden="true"></i>
            <span>Nouvo enstriksyon / Prompt</span>
          </button>
        </div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" aria-selected="true" data-tab="providers">
          <i data-lucide="server" aria-hidden="true"></i>
          <span data-i18n="admin.tab_providers"></span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="prompts">
          <i data-lucide="file-code" aria-hidden="true"></i>
          <span data-i18n="admin.tab_prompts"></span>
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-tab="logs">
          <i data-lucide="activity" aria-hidden="true"></i>
          <span data-i18n="admin.tab_logs"></span>
        </button>
      </div>

      <!-- Onglet Fournisseurs IA -->
      <section id="panel-providers">
        <div class="grid grid-2" id="providers-grid">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </section>

      <!-- Onglet Prompts -->
      <section id="panel-prompts" hidden>
        <div class="admin-toolbar">
          <select class="select" id="prompt-task-filter" style="width:auto;min-width:210px;" aria-label="Tach">
            <option value="all" data-i18n="common.all"></option>
            <option value="ocr_board">ocr_board</option>
            <option value="transcribe">transcribe</option>
            <option value="process_note">process_note</option>
            <option value="process_syllabus">process_syllabus</option>
            <option value="generate_flashcards">generate_flashcards</option>
            <option value="generate_test">generate_test</option>
            <option value="grade_answer">grade_answer</option>
            <option value="tutor">tutor</option>
            <option value="assignment_assist">assignment_assist</option>
            <option value="explain">explain</option>
          </select>
        </div>
        <div id="prompts-list" class="stack">
          <div class="skeleton skeleton-card"></div>
        </div>
      </section>

      <!-- Onglet Journaux & File d'attente -->
      <section id="panel-logs" hidden>
        <section class="grid grid-4 mb-6" id="ai-logs-kpis"></section>

        <div class="card mb-6">
          <h2 class="card-title mb-4">Rele pa founisè (200 dènye) / Appels par fournisseur</h2>
          <div class="chart-box sm">
            <canvas id="admin-ai-chart"></canvas>
          </div>
        </div>

        <div class="card mb-6">
          <div class="section-head mb-3">
            <h2 class="card-title">Dènye apèl IA / Journal récent</h2>
            <label class="switch" style="min-height:36px;">
              <input type="checkbox" id="logs-errors-only">
              <span class="switch-track"></span>
              <span class="text-xs">Erè sèlman / Erreurs uniquement</span>
            </label>
          </div>
          <div id="ai-usage-table"></div>
        </div>

        <div class="card">
          <div class="section-head mb-3">
            <h2 class="card-title">Fil atant (ai_jobs)</h2>
          </div>
          <div id="ai-jobs-box"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../../assets/js/pages/admin-ai.js"></script>
</body>
</html>
