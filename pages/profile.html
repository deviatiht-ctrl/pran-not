<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pwofil — Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pran Nòt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/mobile-nav.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <main id="main" class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow"><i data-lucide="user" aria-hidden="true"></i><span data-i18n="nav.profile"></span></span>
        <h1 data-i18n="profile.title"></h1>
        <p data-i18n="profile.sub"></p>
      </div>
      <div class="page-head-actions">
        <a class="btn btn-secondary" href="./progress.html"><i data-lucide="bar-chart-2" aria-hidden="true"></i><span data-i18n="nav.progress"></span></a>
        <a class="btn btn-secondary" href="./settings.html"><i data-lucide="settings" aria-hidden="true"></i><span data-i18n="nav.settings"></span></a>
      </div>
    </div>

    <div class="grid grid-main-side">
      <div class="stack">
        <section class="card">
          <div class="row mb-6" style="flex-wrap:wrap;">
            <div class="avatar avatar-lg" id="prof-avatar"></div>
            <div>
              <h2 class="mb-1" id="prof-name-head">...</h2>
              <p class="text-sm muted mb-2" id="prof-email-head"></p>
              <label class="btn btn-sm btn-secondary">
                <i data-lucide="camera" aria-hidden="true"></i>
                <span>Chanje foto</span>
                <input id="avatar-input" type="file" accept="image/*" hidden>
              </label>
            </div>
          </div>

          <form id="profile-form">
            <div class="form-row">
              <div class="field"><label for="pf-name" data-i18n="onboarding.full_name"></label><input class="input" id="pf-name" required></div>
              <div class="field"><label for="pf-uni" data-i18n="onboarding.university"></label><input class="input" id="pf-uni"></div>
            </div>
            <div class="form-row">
              <div class="field"><label for="pf-fac" data-i18n="onboarding.faculty"></label><select class="select" id="pf-fac"></select></div>
              <div class="field"><label for="pf-lvl" data-i18n="onboarding.level"></label><select class="select" id="pf-lvl"></select></div>
            </div>
            <div class="form-row">
              <div class="field"><label for="pf-goal" data-i18n="onboarding.daily_goal"></label><input class="input" id="pf-goal" type="number" min="5" max="600"></div>
              <div class="field"><label for="pf-rem" data-i18n="onboarding.reminder_time"></label><input class="input" id="pf-rem" type="time"></div>
            </div>
            <div class="field">
              <label for="pf-wa" data-i18n="profile.whatsapp_phone"></label>
              <input class="input" id="pf-wa" type="tel" inputmode="tel" data-i18n-placeholder="profile.whatsapp_phone_ph">
              <div class="text-xs muted mt-1" data-i18n="profile.whatsapp_hint"></div>
            </div>
            <button type="submit" class="btn btn-primary" id="pf-save-btn"><i data-lucide="save" aria-hidden="true"></i><span data-i18n="common.save"></span></button>
          </form>
        </section>

        <section class="card" id="badges">
          <h2 class="card-title mb-4" data-i18n="profile.badges"></h2>
          <div class="grid grid-3" id="badges-grid"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card" id="profile-stats"></section>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../assets/js/pages/profile.js"></script>
</body>
</html>
