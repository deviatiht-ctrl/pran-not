<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bibliyotèk ak Kòd — Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pran Nòt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/mobile-nav.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <main id="main" class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow"><i data-lucide="library" aria-hidden="true"></i><span data-i18n="library.eyebrow"></span></span>
        <h1 data-i18n="library.title"></h1>
        <p data-i18n="library.sub"></p>
      </div>
      <div class="page-head-actions">
        <button type="button" class="btn btn-secondary" id="lib-droit-btn">
          <i data-lucide="scale" aria-hidden="true"></i>
          <span data-i18n="library.droit_quick_btn"></span>
        </button>
        <button type="button" class="btn btn-primary" id="lib-upload-btn">
          <i data-lucide="upload" aria-hidden="true"></i>
          <span data-i18n="library.upload_btn"></span>
        </button>
      </div>
    </div>

    <!-- Onglets principaux de la Bibliothèque -->
    <div class="tabs" role="tablist" id="library-tabs">
      <button type="button" class="tab" role="tab" data-tab="books" aria-selected="true">
        <i data-lucide="book-open" aria-hidden="true"></i>
        <span data-i18n="library.tab_books"></span>
      </button>
      <button type="button" class="tab" role="tab" data-tab="web" aria-selected="false">
        <i data-lucide="globe" aria-hidden="true"></i>
        <span data-i18n="library.tab_web"></span>
      </button>
      <button type="button" class="tab" role="tab" data-tab="ask" aria-selected="false">
        <i data-lucide="sparkles" aria-hidden="true"></i>
        <span data-i18n="library.tab_ask"></span>
      </button>
      <button type="button" class="tab" role="tab" data-tab="creator" aria-selected="false">
        <i data-lucide="book-plus" aria-hidden="true"></i>
        <span data-i18n="library.tab_creator"></span>
      </button>
    </div>

    <!-- ===============================================================
         PANNEAU 1 : BIBLIOTHÈQUE OFFICIELLE & PERSONNELLE (PDF / CODES)
         =============================================================== -->
    <section id="panel-books">
      <div class="card card-sm mb-6">
        <div class="row-wrap" style="gap:12px;">
          <div class="input-group flex-1" style="min-width:220px;">
            <i data-lucide="search" aria-hidden="true"></i>
            <input class="input" type="search" id="lib-book-search" data-i18n-placeholder="library.search_books_ph">
          </div>
          <select class="select" id="lib-scope-filter" style="width:auto;min-width:160px;">
            <option value="" data-i18n="library.filter_scope_all"></option>
            <option value="official" data-i18n="library.scope_official"></option>
            <option value="personal" data-i18n="library.scope_personal"></option>
            <option value="generated" data-i18n="library.scope_generated"></option>
          </select>
          <select class="select" id="lib-faculty-filter" style="width:auto;min-width:175px;">
            <option value="" data-i18n="library.filter_faculty_all"></option>
          </select>
        </div>
      </div>

      <!-- Résultats pertinents par extraits lorsqu'une recherche est tapée -->
      <div id="lib-chunk-hits" class="mb-6" hidden></div>

      <div id="lib-books-grid" class="grid grid-3">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </section>

    <!-- ===============================================================
         PANNEAU 2 : RECHERCHE WEB RÉELLE & ANALYSE ANTI-PLAGIAT
         =============================================================== -->
    <section id="panel-web" hidden>
      <div class="grid grid-main-side">
        <div class="stack">
          <div class="card">
            <h2 class="card-title mb-3" data-i18n="library.tab_web"></h2>
            <form id="web-search-form" class="row-wrap" style="gap:10px;">
              <div class="input-group flex-1" style="min-width:220px;">
                <i data-lucide="globe" aria-hidden="true"></i>
                <input class="input" type="search" id="web-search-input" required data-i18n-placeholder="library.web_search_ph">
              </div>
              <button type="submit" class="btn btn-primary" id="web-search-btn">
                <i data-lucide="search" aria-hidden="true"></i>
                <span data-i18n="library.web_search_btn"></span>
              </button>
            </form>
          </div>

          <div id="web-search-results" class="stack" hidden></div>
        </div>

        <aside class="stack">
          <div class="card">
            <h2 class="card-title mb-3" data-i18n="library.analyze_custom_title"></h2>
            <form id="analyze-form">
              <div class="field">
                <label for="analyze-url" data-i18n="library.analyze_url_label"></label>
                <input class="input" type="url" id="analyze-url" placeholder="https://...">
              </div>
              <div class="field">
                <label for="analyze-topic" data-i18n="library.analyze_topic_label"></label>
                <input class="input" type="text" id="analyze-topic" placeholder="Ex : Responsabilite civile / Atik 24">
              </div>
              <div class="field">
                <label for="analyze-text" data-i18n="library.analyze_text_label"></label>
                <textarea class="textarea" id="analyze-text" rows="5" placeholder="Kole tèks yon atik oswa yon kòd lwa pou resevwa yon sentèz san plajya ak referans APA..."></textarea>
              </div>
              <label class="switch mb-4">
                <input type="checkbox" id="analyze-save-switch" checked>
                <span class="switch-track"></span>
                <span class="text-sm" data-i18n="library.analyze_save_switch"></span>
              </label>
              <button type="submit" class="btn btn-primary btn-block" id="analyze-run-btn">
                <i data-lucide="shield-check" aria-hidden="true"></i>
                <span data-i18n="library.analyze_run_btn"></span>
              </button>
            </form>
            <div id="analyze-result-box" class="mt-4" hidden></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ===============================================================
         PANNEAU 3 : ASSISTANT IA SUR LES LIVRES & CODES
         =============================================================== -->
    <section id="panel-ask" hidden>
      <div class="grid grid-main-side">
        <aside class="stack">
          <div class="card">
            <label class="label mb-2" style="display:block;" data-i18n="library.ask_select_books"></label>
            <div class="lib-checklist" id="ask-books-list"></div>
            <label class="switch mt-4">
              <input type="checkbox" id="ask-web-switch">
              <span class="switch-track"></span>
              <span class="text-sm" data-i18n="library.ask_web_switch"></span>
            </label>
          </div>
        </aside>

        <div class="stack">
          <div class="card">
            <form id="ask-library-form">
              <div class="field">
                <textarea class="textarea" id="ask-question" rows="4" required data-i18n-placeholder="library.ask_question_ph"></textarea>
              </div>
              <div class="row-wrap mb-4" id="ask-quick-chips">
                <button type="button" class="chip" data-ask-q="Ki kondisyon Konstitisyon Ayiti a fikse nan atik 24 pou arestasyon ak detansyon ?">Konstitisyon Atik 24</button>
                <button type="button" class="chip" data-ask-q="Esplike kondisyon responsabilite sivil nan atik 1168 Kòd Sivil la ak silojis jiridik.">Kòd Sivil Atik 1168</button>
                <button type="button" class="chip" data-ask-q="Ki diferans ant krim, deli ak kontravansyon nan Kòd Penal Ayiti a ?">Kòd Penal</button>
              </div>
              <button type="submit" class="btn btn-primary" id="ask-run-btn">
                <i data-lucide="sparkles" aria-hidden="true"></i>
                <span data-i18n="library.ask_run_btn"></span>
              </button>
            </form>
          </div>

          <div id="ask-answer-box" class="stack" hidden></div>
        </div>
      </div>
    </section>

    <!-- ===============================================================
         PANNEAU 4 : CRÉATEUR DE LIVRE & MANUEL ORIGINAL SANS PLAGIAT
         =============================================================== -->
    <section id="panel-creator" hidden>
      <div class="grid grid-main-side">
        <div class="stack">
          <div class="card">
            <h2 class="card-title mb-1" data-i18n="library.creator_title"></h2>
            <p class="text-sm muted mb-4" data-i18n="library.creator_sub"></p>

            <form id="creator-form">
              <div class="field">
                <label for="creator-topic" data-i18n="library.creator_topic_label"></label>
                <input class="input" type="text" id="creator-topic" required data-i18n-placeholder="library.creator_topic_ph">
              </div>

              <div class="form-row">
                <div class="field">
                  <label for="creator-chapters" data-i18n="library.creator_chapters_label"></label>
                  <select class="select" id="creator-chapters">
                    <option value="3">3 chapit</option>
                    <option value="4">4 chapit</option>
                    <option value="5" selected>5 chapit</option>
                    <option value="6">6 chapit</option>
                    <option value="8">8 chapit</option>
                  </select>
                </div>
                <div class="field">
                  <label data-i18n="library.creator_books_label"></label>
                  <div class="lib-checklist" id="creator-books-list"></div>
                </div>
              </div>

              <div class="field mt-2">
                <label for="creator-instructions" data-i18n="library.creator_inst_label"></label>
                <textarea class="textarea" id="creator-instructions" rows="3" data-i18n-placeholder="library.creator_inst_ph"></textarea>
              </div>

              <div class="row-wrap mb-4">
                <label class="switch">
                  <input type="checkbox" id="creator-web-switch" checked>
                  <span class="switch-track"></span>
                  <span class="text-sm" data-i18n="library.creator_web_switch"></span>
                </label>
                <label class="switch">
                  <input type="checkbox" id="creator-save-switch" checked>
                  <span class="switch-track"></span>
                  <span class="text-sm" data-i18n="library.creator_save_switch"></span>
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-lg" id="creator-run-btn">
                <i data-lucide="book-plus" aria-hidden="true"></i>
                <span data-i18n="library.creator_run_btn"></span>
              </button>
            </form>
          </div>
        </div>

        <div class="stack">
          <div id="creator-result-box" class="card" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../assets/js/pages/library.js"></script>
</body>
</html>
