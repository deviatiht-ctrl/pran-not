<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silabis — Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pran Nòt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/mobile-nav.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <main id="main" class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow"><i data-lucide="file-up" aria-hidden="true"></i><span data-i18n="courses.import_syllabus"></span></span>
        <h1 data-i18n="syllabus.title"></h1>
        <p data-i18n="syllabus.sub"></p>
      </div>
      <div class="page-head-actions">
        <a class="btn btn-secondary" href="./courses.html"><i data-lucide="arrow-left" aria-hidden="true"></i><span data-i18n="common.back"></span></a>
      </div>
    </div>

    <div class="grid grid-main-side">
      <div class="stack">
        <section class="card">
          <div class="field">
            <label for="syl-course" data-i18n="syllabus.select_course"></label>
            <select class="select" id="syl-course"></select>
          </div>
          <div class="field">
            <label for="syl-file" data-i18n="syllabus.upload_file"></label>
            <input class="input" id="syl-file" type="file" accept="application/pdf,image/*,.txt" style="padding-top:9px;">
          </div>
          <div class="field">
            <label for="syl-text" data-i18n="syllabus.paste_text"></label>
            <textarea class="textarea" id="syl-text" rows="8" placeholder="Kole plan kou a, chapit yo, dat egzamen ak evalyasyon yo isit la..."></textarea>
          </div>
          <button type="button" class="btn btn-primary" id="syl-analyze-btn">
            <i data-lucide="sparkles" aria-hidden="true"></i>
            <span data-i18n="syllabus.analyze"></span>
          </button>
        </section>

        <section class="card" id="syl-result-card" hidden>
          <div class="card-head">
            <h2 class="card-title" data-i18n="courses.units_title"></h2>
            <button type="button" class="btn btn-primary" id="syl-save-btn">
              <i data-lucide="check" aria-hidden="true"></i>
              <span data-i18n="syllabus.save_units"></span>
            </button>
          </div>
          <div id="syl-units-preview" class="stack-sm"></div>
        </section>
      </div>

      <aside class="stack" id="syl-meta-aside" hidden>
        <section class="card">
          <h2 class="card-title mb-2" data-i18n="syllabus.objectives"></h2>
          <ul class="list" id="syl-objectives"></ul>
        </section>
        <section class="card">
          <h2 class="card-title mb-2" data-i18n="syllabus.eval_weights"></h2>
          <p class="text-sm mb-0" id="syl-eval"></p>
        </section>
        <section class="card">
          <h2 class="card-title mb-2" data-i18n="courses.study_order"></h2>
          <ol id="syl-order" class="text-sm" style="padding-left:1.3em;margin:0;"></ol>
        </section>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../assets/js/pages/syllabus.js"></script>
</body>
</html>
