<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tès — Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pran Nòt">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/mobile-nav.css">
  <link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <main id="main" class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow"><i data-lucide="check-circle-2" aria-hidden="true"></i><span data-i18n="nav.tests"></span></span>
        <h1 data-i18n="tests.title"></h1>
        <p data-i18n="tests.sub"></p>
      </div>
      <div class="page-head-actions">
        <button type="button" class="btn btn-secondary" id="remedial-btn">
          <i data-lucide="target" aria-hidden="true"></i>
          <span data-i18n="tests.remedial"></span>
        </button>
        <button type="button" class="btn btn-primary" id="new-test-btn">
          <i data-lucide="sparkles" aria-hidden="true"></i>
          <span data-i18n="tests.generate"></span>
        </button>
      </div>
    </div>

    <div class="grid grid-main-side">
      <div class="stack">
        <section class="card">
          <h2 class="card-title mb-3">Tès ki disponib</h2>
          <div id="tests-list">
            <div class="skeleton skeleton-line"></div>
            <div class="skeleton skeleton-line"></div>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title mb-3">Istwa rezilta yo</h2>
          <div class="chart-box sm mb-4"><canvas id="tests-chart"></canvas></div>
          <div id="attempts-list"></div>
        </section>
      </div>

      <aside class="stack">
        <section class="card">
          <h2 class="card-title mb-3" data-i18n="tests.weak_points"></h2>
          <div id="weak-keywords-box"></div>
        </section>

        <section class="card">
          <h2 class="card-title mb-3" data-i18n="tests.readiness"></h2>
          <div id="readiness-box"></div>
        </section>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../assets/js/pages/tests.js"></script>
</body>
</html>
