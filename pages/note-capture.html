<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaptire nòt — Pran Nòt</title>
  <meta name="theme-color" content="#1B2A4A">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script>(function(){try{var s=localStorage.getItem('prannot.theme_vars');if(!s)return;var p=JSON.parse(s),r=document.documentElement;if(p.mode)r.setAttribute('data-theme-mode',p.mode);if(p.cardStyle)r.setAttribute('data-card-style',p.cardStyle);if(p.vars){for(var k in p.vars)r.style.setProperty(k,p.vars[k]);}if(p.fontHref){var l=document.createElement('link');l.id='prannot-custom-fonts';l.rel='stylesheet';l.href=p.fontHref;document.head.appendChild(l);}if(p.themeColor){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',p.themeColor);}}catch(e){}})();</script>
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/navbar.css">
  <link rel="stylesheet" href="../assets/css/mobile-nav.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    .ql-container.ql-snow { min-height: 220px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Ale nan kontni prensipal</a>

  <main id="main" class="app-main">
    <div class="page-head">
      <div>
        <span class="eyebrow"><i data-lucide="zap" aria-hidden="true"></i><span data-i18n="capture.page_title"></span></span>
        <h1 data-i18n="capture.page_title"></h1>
      </div>
      <div class="page-head-actions">
        <a class="btn btn-secondary" href="./notes.html">
          <i data-lucide="arrow-left" aria-hidden="true"></i>
          <span data-i18n="common.back"></span>
        </a>
      </div>
    </div>

    <!-- Sélecteur de mode -->
    <div class="segmented mb-6" role="tablist" id="capture-modes">
      <button type="button" role="tab" data-mode="photo" aria-selected="true"><i data-lucide="camera" aria-hidden="true"></i><span data-i18n="capture.mode_photo"></span></button>
      <button type="button" role="tab" data-mode="audio" aria-selected="false"><i data-lucide="mic" aria-hidden="true"></i><span data-i18n="capture.mode_audio"></span></button>
      <button type="button" role="tab" data-mode="flash" aria-selected="false"><i data-lucide="zap" aria-hidden="true"></i><span data-i18n="capture.mode_flash"></span></button>
      <button type="button" role="tab" data-mode="text" aria-selected="false"><i data-lucide="file-edit" aria-hidden="true"></i><span data-i18n="capture.mode_text"></span></button>
      <button type="button" role="tab" data-mode="import" aria-selected="false"><i data-lucide="upload" aria-hidden="true"></i><span data-i18n="capture.mode_import"></span></button>
    </div>

    <div class="grid grid-main-side">
      <div class="stack">
        <!-- Panneau a) Photo tableau / cahier -->
        <section class="card" id="panel-photo">
          <div class="row-wrap mb-4">
            <label class="switch">
              <input type="checkbox" id="opt-enhance" checked>
              <span class="switch-track"></span>
              <span class="text-sm" data-i18n="capture.enhance_label"></span>
            </label>
            <label class="switch">
              <input type="checkbox" id="opt-autocrop" checked>
              <span class="switch-track"></span>
              <span class="text-sm" data-i18n="capture.autocrop_label"></span>
            </label>
          </div>

          <label class="drop-zone" for="photo-input" id="photo-drop">
            <span class="icon-chip accent"><i data-lucide="camera" aria-hidden="true"></i></span>
            <strong data-i18n="capture.take_photos"></strong>
            <span class="text-xs muted">JPEG / PNG / WEBP — konprese otomatikman anvan voye</span>
            <input id="photo-input" type="file" accept="image/*" capture="environment" multiple hidden>
          </label>

          <div class="thumb-grid mt-4" id="photo-thumbs"></div>

          <div class="row-wrap mt-4">
            <button type="button" class="btn btn-primary" id="ocr-run-btn" disabled>
              <i data-lucide="sparkles" aria-hidden="true"></i>
              <span data-i18n="capture.read_board"></span>
            </button>
          </div>
        </section>

        <!-- Panneau b) Enregistrement vocal salle de cours + c) Note éclair -->
        <section class="card" id="panel-audio" hidden>
          <div class="row-between mb-3">
            <div class="row">
              <span class="rec-dot" id="rec-dot" hidden></span>
              <div class="timer-display" style="font-size:2.5rem;" id="rec-timer">00:00</div>
            </div>
            <div class="row-wrap">
              <span class="badge" id="rec-chunks-badge">0 segman</span>
            </div>
          </div>

          <p class="text-sm muted mb-4" id="audio-live-hint"></p>

          <!-- Moniteur vocal temps réel (waveform + statut) -->
          <div class="audio-meter-wrap mb-4">
            <div class="row-between text-xs mb-2">
              <span class="badge badge-outline" id="audio-signal-badge" data-i18n="capture.audio_meter_idle"></span>
              <span class="muted" id="audio-auto-note" data-i18n="capture.audio_segment_auto"></span>
            </div>
            <canvas id="audio-meter" class="audio-meter-canvas" height="64" aria-hidden="true"></canvas>
          </div>

          <!-- Sélecteur de micro matériel -->
          <div class="field mb-3">
            <div class="row-between mb-1">
              <label class="label text-xs mb-0" for="mic-device-select" data-i18n="capture.mic_device_label"></label>
              <button type="button" class="btn btn-sm btn-ghost" id="mic-refresh-btn">
                <i data-lucide="refresh-cw" aria-hidden="true"></i>
                <span data-i18n="common.retry"></span>
              </button>
            </div>
            <select class="select" id="mic-device-select">
              <option value="" data-i18n="capture.mic_device_default"></option>
            </select>
          </div>

          <!-- Options acoustiques : profil salle de cours, précision IA et gain micro -->
          <div class="form-row mb-4">
            <div>
              <label class="label text-xs mb-2" style="display:block;" data-i18n="capture.audio_profile_label"></label>
              <div class="segmented" id="audio-profile-group">
                <button type="button" data-audio-profile="classroom" aria-pressed="true" data-i18n="capture.audio_profile_classroom"></button>
                <button type="button" data-audio-profile="close" aria-pressed="false" data-i18n="capture.audio_profile_close"></button>
                <button type="button" data-audio-profile="direct" aria-pressed="false" data-i18n="capture.audio_profile_direct"></button>
              </div>
            </div>
            <div>
              <label class="label text-xs mb-2" style="display:block;" data-i18n="capture.audio_mode_label"></label>
              <div class="segmented" id="transcribe-mode-group">
                <button type="button" data-transcribe-mode="detailed" aria-pressed="true" data-i18n="capture.audio_mode_detailed"></button>
                <button type="button" data-transcribe-mode="fast" aria-pressed="false" data-i18n="capture.audio_mode_fast"></button>
              </div>
            </div>
          </div>

          <div class="alert alert-info mb-3" id="live-speech-box" hidden>
            <i data-lucide="captions" aria-hidden="true"></i>
            <div class="flex-1">
              <strong class="text-xs" data-i18n="capture.live_speech_label"></strong>
              <div class="text-sm mt-1" id="live-speech-preview"></div>
            </div>
          </div>

          <div class="field mb-4">
            <div class="row-between mb-1">
              <label class="label text-xs mb-0" for="rec-gain-slider" data-i18n="capture.audio_gain_label"></label>
              <span class="badge badge-accent" id="rec-gain-val">2.0x</span>
            </div>
            <input type="range" class="studio-range" id="rec-gain-slider" min="1.0" max="3.5" step="0.1" value="2.0">
          </div>

          <div class="row-wrap">
            <button type="button" class="btn btn-primary" id="rec-start-btn">
              <i data-lucide="mic" aria-hidden="true"></i>
              <span data-i18n="capture.rec_start"></span>
            </button>
            <button type="button" class="btn btn-secondary" id="rec-pause-btn" hidden>
              <i data-lucide="pause" aria-hidden="true"></i>
              <span data-i18n="capture.rec_pause"></span>
            </button>
            <button type="button" class="btn btn-dark" id="rec-stop-btn" hidden>
              <i data-lucide="square" aria-hidden="true"></i>
              <span data-i18n="capture.rec_stop"></span>
            </button>
            <label class="btn btn-secondary" for="audio-file-input" title="MP3, M4A, WAV, OGG, WEBM">
              <i data-lucide="file-audio" aria-hidden="true"></i>
              <span data-i18n="capture.audio_import_btn"></span>
              <input id="audio-file-input" type="file" accept="audio/*" multiple hidden>
            </label>
          </div>
          <div id="audio-clips-box" class="stack-sm mt-4"></div>
        </section>

        <!-- Panneau e) Import PDF / image -->
        <section class="card" id="panel-import" hidden>
          <label class="drop-zone" for="import-input">
            <span class="icon-chip accent"><i data-lucide="upload" aria-hidden="true"></i></span>
            <strong data-i18n="capture.mode_import_sub"></strong>
            <span class="text-xs muted">PDF (max 20 Mo) oswa imaj</span>
            <input id="import-input" type="file" accept="application/pdf,image/*" multiple hidden>
          </label>
          <div id="import-status" class="text-sm muted mt-3"></div>
        </section>

        <!-- Zone de texte brut + passages incertains -->
        <section class="card" id="raw-section">
          <div class="row-between mb-2">
            <label class="label mb-0" for="raw-text" data-i18n="capture.raw_text"></label>
            <span class="text-xs muted" id="raw-count">0 mo</span>
          </div>

          <div class="alert alert-warning mb-3" id="uncertain-alert" hidden>
            <i data-lucide="alert-triangle" aria-hidden="true"></i>
            <div class="flex-1">
              <div data-i18n="capture.uncertain_banner"></div>
              <div id="uncertain-chips" class="row-wrap mt-2"></div>
            </div>
          </div>

          <textarea class="textarea" id="raw-text" rows="8" placeholder="Tèks tablo, transkripsyon oswa nòt rapid ou a ap parèt la..."></textarea>

          <div class="row-wrap mt-4">
            <button type="button" class="btn btn-primary" id="ai-structure-btn">
              <i data-lucide="sparkles" aria-hidden="true"></i>
              <span data-i18n="capture.structure_ai"></span>
            </button>
            <button type="button" class="btn btn-secondary" id="ai-ht-btn" data-i18n="capture.harmonize_ht"></button>
            <button type="button" class="btn btn-secondary" id="ai-fr-btn" data-i18n="capture.harmonize_fr"></button>
          </div>
        </section>

        <!-- Éditeur riche (Quill) + résultat structuré -->
        <section class="card">
          <div class="field">
            <label for="note-title">Tit nòt la / Titre</label>
            <input class="input" id="note-title" type="text" placeholder="Ex : Sik kadyak ak bri B1/B2">
          </div>
          <div class="field">
            <label>Kontni pwòp / Contenu structuré</label>
            <div id="quill-editor"></div>
          </div>
          <div id="structured-preview" class="stack-sm mt-4" hidden></div>
        </section>
      </div>

      <!-- Panneau latéral : Cours, langue et enregistrement -->
      <aside class="stack">
        <section class="card">
          <div id="course-suggestion-box" class="ai-suggestion mb-4" hidden>
            <div class="ai-suggestion-label"><i data-lucide="sparkles" aria-hidden="true"></i><span>IA</span></div>
            <p class="text-sm mb-2" id="course-suggestion-text"></p>
            <button type="button" class="btn btn-sm btn-primary" id="confirm-course-btn" data-i18n="capture.confirm_course"></button>
          </div>

          <div class="field">
            <label for="note-course" data-i18n="nav.courses"></label>
            <select class="select" id="note-course">
              <option value="" data-i18n="common.no_course"></option>
            </select>
          </div>

          <div class="field">
            <label for="note-unit">Chapit silabis / Unité</label>
            <select class="select" id="note-unit">
              <option value="" data-i18n="common.none"></option>
            </select>
          </div>

          <div class="field">
            <label for="note-lang">Lang nòt la</label>
            <select class="select" id="note-lang">
              <option value="mix">Kreyòl + Fransè (melanje)</option>
              <option value="ht">Kreyòl ayisyen</option>
              <option value="fr">Français</option>
            </select>
          </div>

          <button type="button" class="btn btn-primary btn-block btn-lg mt-2" id="save-note-btn">
            <i data-lucide="save" aria-hidden="true"></i>
            <span data-i18n="capture.save_note"></span>
          </button>
        </section>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script type="module" src="../assets/js/pages/note-capture.js"></script>
</body>
</html>
